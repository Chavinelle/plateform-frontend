<!-- premier élément atteint au clavier : aller directement au contenu, sans parcourir le menu -->
<a class="skip-link" href="#contenu">Aller au contenu</a>

@if (withSidebar()) {
  <div class="shell">
    <app-sidebar />
    <div class="shell-main">
      <app-topbar />
      <main id="contenu" class="content" tabindex="-1"><router-outlet /></main>
      <app-footer [compact]="true" />
    </div>
  </div>
} @else {
  <app-navbar />
  <main id="contenu" class="content" tabindex="-1"><router-outlet /></main>
  <app-footer [compact]="loggedIn()" />
}
