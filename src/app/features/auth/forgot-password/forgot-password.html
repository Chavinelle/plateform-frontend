 <div class="auth-card">
      <h1>Mot de passe oublié</h1>
      <p>Indiquez votre e-mail : nous vous enverrons un code de réinitialisation.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="field-error">Une adresse e-mail valide est requise.</small>
        }

        @if (error()) { <p class="form-error" role="alert">{{ error() }}</p> }

        <button type="submit" [disabled]="loading()">{{ loading() ? 'Envoi…' : 'Envoyer le code' }}</button>
      </form>

      <p><a routerLink="/login">Retour à la connexion</a></p>
    </div>
